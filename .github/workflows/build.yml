name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos:
    name: macOS (AU + VST3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoDuck-macOS
          path: |
            build/AutoDuck_artefacts/Release/AU
            build/AutoDuck_artefacts/Release/VST3
          if-no-files-found: error

  linux:
    name: Linux compile check (VST3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4
